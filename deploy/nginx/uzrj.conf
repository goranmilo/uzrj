# Nginx vhost za UZRJ (Ubuntu 24.04, PHP 8.3-FPM)
#
# Instalacija:
#   sudo cp deploy/nginx/uzrj.conf /etc/nginx/sites-available/uzrj
#   sudo ln -s /etc/nginx/sites-available/uzrj /etc/nginx/sites-enabled/uzrj
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Posle toga HTTPS:
#   sudo certbot --nginx -d uzrj.example.rs
# Certbot sam dopisuje 443 blok i preusmeravanje sa 80; ovaj fajl ostaje osnova.

server {
    listen 80;
    listen [::]:80;

    server_name uzrj.example.rs;

    root /var/www/uzrj/public;
    index index.php;

    charset utf-8;

    # Uvoz članova šalje Excel fajl kroz Livewire upload — bez ovoga veći
    # fajl puca sa 413 pre nego što aplikacija uopšte vidi zahtev.
    # Uskladiti sa upload_max_filesize i post_max_size u php.ini.
    client_max_body_size 20M;

    access_log /var/log/nginx/uzrj-access.log;
    error_log /var/log/nginx/uzrj-error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Filament objavljuje svoje asset-e u public/css i public/js
    # (php artisan filament:assets), pa se mogu dugo keširati.
    location ~* ^/(css|js)/.*\.(css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;

        # Uvoz većeg spiska članova ume da traje duže od podrazumevanih 60s.
        fastcgi_read_timeout 180;
    }

    # Ne serviraj skrivene fajlove (.env, .git), osim ACME provere za certifikat.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
